version: '3.8'

services:
  validator-api:
    build: ./validator-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    depends_on: []

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: fido
      POSTGRES_PASSWORD: fido
      POSTGRES_DB: fido
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
