version: '3.8'

services:
  validator-api:
    build: ./validator-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
    depends_on:
      - cassandra

  cassandra:
    image: cassandra:4.1
    environment:
      - CASSANDRA_CLUSTER_NAME=fido-cluster
      - CASSANDRA_DC=dc1
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra

  playwright:
    image: mcr.microsoft.com/playwright:focal
    environment:
      - CI=true
    depends_on:
      - validator-api

volumes:
  cassandra_data:
